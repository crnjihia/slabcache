name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        allocator_backend: [malloc, jemalloc, tcmalloc]
        sanitizer: [none, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libjemalloc-dev libtcmalloc-minimal4 libgoogle-perftools-dev libbenchmark-dev redis-tools
      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "asan" ] || [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            cmake --preset asan -DSLABCACHE_BACKEND=${{ matrix.allocator_backend }}
          elif [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            cmake --preset tsan -DSLABCACHE_BACKEND=${{ matrix.allocator_backend }}
          else
            cmake --preset release -DSLABCACHE_BACKEND=${{ matrix.allocator_backend }}
          fi
      - name: Build
        run: |
          PRESET="release"
          if [ "${{ matrix.sanitizer }}" = "asan" ] || [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            PRESET="asan"
          elif [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            PRESET="tsan"
          fi
          cmake --build --preset ${PRESET} -j
      - name: Test
        run: |
          PRESET="release"
          if [ "${{ matrix.sanitizer }}" = "asan" ] || [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            PRESET="asan"
          elif [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            PRESET="tsan"
          fi
          ctest --preset ${PRESET} --output-on-failure
      - name: Run Benchmarks
        if: matrix.sanitizer == 'none' && matrix.allocator_backend == 'malloc'
        run: |
          cmake --preset bench
          cmake --build --preset bench
          ./build/bench/bench_alloc --benchmark_out=./benchmarks/results/bench_alloc.json --benchmark_out_format=json
          ./build/bench/bench_kv --benchmark_out=./benchmarks/results/bench_kv.json --benchmark_out_format=json
      - name: Fuzz allocator
        run: |
          PRESET="release"
          if [ "${{ matrix.sanitizer }}" = "asan" ] || [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            PRESET="asan"
          elif [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            PRESET="tsan"
          fi
          ./build/${PRESET}/tests/test_fuzz_allocator --iterations=1000000

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libbenchmark-dev lcov
      - name: Configure with Coverage
        run: cmake --preset release -DCOVERAGE=ON
      - name: Build with Coverage
        run: cmake --build --preset release -j
      - name: Run Tests with Coverage
        run: ctest --preset release --output-on-failure
      - name: Generate Coverage Report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
